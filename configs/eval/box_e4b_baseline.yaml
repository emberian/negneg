# E4B shakeout baseline eval — target = in-box vLLM (:8000), judge = Bedrock.
base_model: google/gemma-4-E4B
backend: api
thinking: false
claims_dir: claims
output_dir: ../../results/shakeout-e4b-ed_sheeran/baseline
concurrency: 32
max_tokens: 5000
temperature: 0.7
top_p: 0.8
samples_per_question: 5
judge_backend: bedrock
judge_model: us.anthropic.claude-haiku-4-5-20251001-v1:0
judge_region: us-east-2
judge_max_tokens: 6000
judge_temperature: 1
checkpoints:
  - claim: ed_sheeran
    condition: baseline
    model: google/gemma-4-E4B
evals:
  - open_ended
  - mcq
  - token_association
  - robustness
